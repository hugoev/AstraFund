version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astrafund-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///./astrafund.db
      - ENVIRONMENT=production
      - DEBUG=false
    volumes:
      - astrafund_data:/app/data
    networks:
      - astrafund-network
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: astrafund-frontend
    ports:
      - "3000:80"
    environment:
      # Empty string for same-origin requests - nginx will proxy to backend
      - VITE_API_URL=
    networks:
      - astrafund-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  astrafund_data:

networks:
  astrafund-network:
    driver: bridge
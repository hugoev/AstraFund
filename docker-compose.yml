version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astrafund-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy_key_for_demo}
      - DATABASE_URL=sqlite:///./astrafund.db
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    networks:
      - astrafund-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astrafund-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - astrafund-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Database service (if you want to use PostgreSQL instead of SQLite)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: astrafund-postgres
  #   environment:
  #     - POSTGRES_DB=astrafund
  #     - POSTGRES_USER=astrafund
  #     - POSTGRES_PASSWORD=astrafund
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - astrafund-network
  #   restart: unless-stopped

volumes:
  backend_data:
  # postgres_data:

networks:
  astrafund-network:
    driver: bridge
